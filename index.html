<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OptiK1ng | Games & Wallpapers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f1a;
            color: white;
        }

        header {
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
        }

        nav {
            background: #020617;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #38bdf8;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #020617;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            background: #020617;
            text-align: center;
            padding: 15px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 OptiK1ng Games & Wallpapers</h1>
    <p>Juegos, fondos gamer y estilo pro</p>
</header>

<nav>
    <a href="#juegos">Juegos</a>
    <a href="#wallpapers">Wallpapers</a>
</nav>

<section id="juegos">
    <h2>🕹️ Juegos</h2>
    <div class="cards">
        <div class="card">
            <h3>Minecraft</h3>
            <p>Explora, construye y sobrevive</p>
        </div>
        <div class="card">
            <h3>Free Fire</h3>
            <p>Battle Royale móvil</p>
        </div>
        <div class="card">
            <h3>Roblox</h3>
            <p>Juega y crea mundos</p>
        </div>
    </div>
</section>

<section id="wallpapers">
    <h2>🖼️ Wallpapers</h2>
    <div class="cards">
        <div class="card">
            <img src="https://picsum.photos/400/250?random=1">
            <p>Wallpaper Gamer</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/400/250?random=2">
            <p>Wallpaper Neon</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/400/250?random=3">
            <p>Wallpaper Dark</p>
        </div>
    </div>
</section>

<footer>
    © 2026 OptiK1ng | Página gamer
</footer>

</body>
</html>
